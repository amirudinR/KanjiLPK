<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f1e3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kanji Notebook" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Buku catatan hafalan kanji JFT - flashcard berurutan dengan audio, kuis, game, dan progres belajar. Bisa dipakai offline."
    />
    <title>Kanji Notebook · Hafalan Kanji JFT</title>
    <!-- Terapkan tema SEBELUM paint pertama supaya tidak ada kedip putih
         saat mode gelap. Harus blocking & di head (dijalankan sebelum body). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kanji-hafalan-theme-v1');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#12141a' : '#f6f1e3');
        } catch (e) {
          /* localStorage/matchMedia tidak tersedia */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Gloria+Hallelujah&family=Noto+Sans+JP:wght@500;700;900&family=Nunito:wght@400;600;700&family=Patrick+Hand&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Bersihkan sisa service worker / cache dari aplikasi lain (mis. PWA
      // "Kotoba") yang pernah menempati domain ini. PENTING: JANGAN hapus
      // service worker milik aplikasi ini sendiri — kalau dihapus, mode
      // offline (PWA) tidak akan pernah aktif.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            var url = (reg.active && reg.active.scriptURL) || reg.scope || '';
            // Hanya singkirkan SW asing; biarkan workbox milik kita tetap hidup.
            var ours =
              url.indexOf('workbox') !== -1 ||
              url.indexOf('sw.js') !== -1 ||
              url.indexOf('service-worker') !== -1;
            if (!ours) reg.unregister();
          });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            // Simpan cache milik kita (google-fonts / workbox), buang sisanya.
            var keep =
              key.indexOf('workbox') !== -1 ||
              key.indexOf('google-fonts') !== -1 ||
              key.indexOf('kanji') !== -1;
            if (!keep) caches.delete(key);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
