<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#f6f1e3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Buku catatan hafalan kanji JFT — flashcard berurutan dengan audio, kuis, dan progres belajar."
    />
    <title>Kanji Notebook · Hafalan Kanji JFT</title>
    <!-- Terapkan tema SEBELUM paint pertama supaya tidak ada kedip putih
         saat mode gelap. Harus blocking & di head (dijalankan sebelum body). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kanji-hafalan-theme-v1');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#12141a' : '#f6f1e3');
        } catch (e) {
          /* localStorage/matchMedia tidak tersedia */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Gloria+Hallelujah&family=Noto+Sans+JP:wght@500;700;900&family=Nunito:wght@400;600;700&family=Patrick+Hand&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Bersihkan sisa service worker / cache dari aplikasi lama (Kotoba PWA)
      // yang pernah menempati domain ini, supaya tidak menyodorkan versi basi.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            reg.unregister();
          });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (key.indexOf('kanji-notebook') === -1) {
              caches.delete(key);
            }
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
